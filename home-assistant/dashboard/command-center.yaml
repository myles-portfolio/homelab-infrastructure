title: Command Center

views:
  - type: sections
    title: Home
    path: home
    icon: mdi:home
    theme: Command Center
    max_columns: 3

    # The live dashboard uses a private astronomical background image.
    # Add a sanitized or public-safe image here if desired.

    header:
      card:
        type: markdown
        text_only: true
        content: |-
          # Home Command Center
          {{ now().strftime('%A, %B %-d') }} · Your Assistant is Ready

    sections:

      ############################################################
      # LEFT COLUMN
      ############################################################

      - type: grid
        cards:

          - type: heading
            heading: Quick Actions
            heading_style: title
            icon: mdi:gesture-tap-button

          - type: grid
            columns: 2
            square: false
            cards:

              - type: custom:button-card
                entity: script.morning_routine
                name: Morning
                label: Morning routine
                icon: mdi:weather-sunset-up
                show_label: true
                tap_action:
                  action: toggle
                styles:
                  card:
                    - border-radius: 18px
                    - padding: 18px
                    - min-height: 118px
                    - background: linear-gradient(145deg, rgba(255,209,102,0.14), rgba(24,26,31,0.92))
                    - border: 1px solid rgba(255,209,102,0.16)
                    - box-shadow: none
                  icon:
                    - color: "#FFD166"
                    - width: 42px
                  name:
                    - font-weight: 600
                    - font-size: 14px
                  label:
                    - font-size: 11px
                    - color: rgba(255,255,255,0.55)

              - type: custom:button-card
                entity: script.away_routine
                name: Away
                label: Leave home
                icon: mdi:car
                show_label: true
                tap_action:
                  action: toggle
                styles:
                  card:
                    - border-radius: 18px
                    - padding: 18px
                    - min-height: 118px
                    - background: linear-gradient(145deg, rgba(122,162,247,0.14), rgba(24,26,31,0.92))
                    - border: 1px solid rgba(122,162,247,0.16)
                    - box-shadow: none
                  icon:
                    - color: "#7AA2F7"
                    - width: 42px

              - type: custom:button-card
                entity: script.arrival_routine
                name: Welcome home
                label: Arrival routine
                icon: mdi:home-account
                show_label: true
                tap_action:
                  action: toggle
                styles:
                  card:
                    - border-radius: 18px
                    - padding: 18px
                    - min-height: 118px
                    - background: linear-gradient(145deg, rgba(99,210,151,0.14), rgba(24,26,31,0.92))
                    - border: 1px solid rgba(99,210,151,0.16)
                    - box-shadow: none
                  icon:
                    - color: "#63D297"
                    - width: 42px

              - type: custom:button-card
                entity: script.sleep_routine
                name: Night
                label: Sleep mode
                icon: mdi:weather-night
                show_label: true
                tap_action:
                  action: toggle
                styles:
                  card:
                    - border-radius: 18px
                    - padding: 18px
                    - min-height: 118px
                    - background: linear-gradient(145deg, rgba(187,154,247,0.14), rgba(24,26,31,0.92))
                    - border: 1px solid rgba(187,154,247,0.16)
                    - box-shadow: none
                  icon:
                    - color: "#BB9AF7"
                    - width: 42px

          - type: heading
            heading: At a Glance
            heading_style: subtitle
            icon: mdi:eye-outline

          - type: grid
            columns: 2
            square: false
            cards:

              - type: custom:mushroom-template-card
                entity: sensor.next_dusk
                primary: Dusk
                secondary: >
                  {% set value = states('sensor.next_dusk') %}
                  {% if value not in ['unknown', 'unavailable'] %}
                    {{ as_timestamp(value) | timestamp_custom('%-I:%M %p', true) }}
                  {% else %}
                    Unavailable
                  {% endif %}
                icon: mdi:weather-sunset-down
                icon_color: orange

              - type: custom:mushroom-template-card
                entity: sensor.next_dawn
                primary: Dawn
                secondary: >
                  {% set value = states('sensor.next_dawn') %}
                  {% if value not in ['unknown', 'unavailable'] %}
                    {{ as_timestamp(value) | timestamp_custom('%-I:%M %p', true) }}
                  {% else %}
                    Unavailable
                  {% endif %}
                icon: mdi:weather-sunset-up
                icon_color: amber

              - type: custom:mushroom-template-card
                entity: sensor.grid_status
                primary: Grid
                secondary: "{{ states('sensor.grid_status') | title }}"
                icon: mdi:transmission-tower
                icon_color: >
                  {% if is_state('sensor.grid_status', 'normal') %}
                    green
                  {% else %}
                    red
                  {% endif %}

          - type: heading
            heading: Home Status
            heading_style: subtitle
            icon: mdi:home-heart

          - type: grid
            columns: 2
            square: false
            cards:

              - type: custom:mushroom-template-card
                entity: person.resident
                primary: Resident
                secondary: "{{ states('person.resident') | title }}"
                icon: mdi:account
                icon_color: >
                  {% if is_state('person.resident', 'home') %}
                    green
                  {% else %}
                    blue
                  {% endif %}

              - type: custom:mushroom-template-card
                entity: alarm_control_panel.home
                primary: Security
                secondary: >
                  {{ states('alarm_control_panel.home') | replace('_', ' ') | title }}
                icon: mdi:shield-home
                icon_color: >
                  {% if is_state('alarm_control_panel.home', 'disarmed') %}
                    grey
                  {% else %}
                    red
                  {% endif %}

          - type: custom:mushroom-template-card
            entity: input_boolean.work_from_home
            primary: Work From Home
            secondary: "{{ states('input_boolean.work_from_home') | title }}"
            icon: mdi:home-account
            icon_color: cyan
            tap_action:
              action: toggle

          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-template-card
                entity: binary_sensor.front_door
                primary: Front Door
                secondary: >
                  {% if is_state('binary_sensor.front_door', 'on') %}Open{% else %}Closed{% endif %}
                icon: mdi:door
                icon_color: >
                  {% if is_state('binary_sensor.front_door', 'on') %}red{% else %}green{% endif %}

              - type: custom:mushroom-template-card
                entity: binary_sensor.back_door
                primary: Back Door
                secondary: >
                  {% if is_state('binary_sensor.back_door', 'on') %}Open{% else %}Closed{% endif %}
                icon: mdi:door
                icon_color: >
                  {% if is_state('binary_sensor.back_door', 'on') %}red{% else %}green{% endif %}

              - type: custom:mushroom-template-card
                entity: cover.garage_door
                primary: Garage
                secondary: "{{ states('cover.garage_door') | title }}"
                icon: mdi:garage
                icon_color: >
                  {% if is_state('cover.garage_door', 'closed') %}green{% else %}orange{% endif %}

          - type: heading
            heading: Home Controls
            heading_style: subtitle
            icon: mdi:toggle-switch

          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:button-card
                entity: light.living_room
                name: Living Room
                icon: mdi:lightbulb
                show_state: true
                tap_action:
                  action: toggle
                styles:
                  card:
                    - border-radius: 18px
                    - min-height: 88px
                    - padding: 14px

              - type: custom:button-card
                entity: switch.office_plug
                name: Office Plug
                icon: mdi:power-socket-us
                show_state: true
                tap_action:
                  action: toggle
                styles:
                  card:
                    - border-radius: 18px
                    - min-height: 88px
                    - padding: 14px

              - type: custom:button-card
                entity: switch.living_room_plug
                name: Living Plug
                icon: mdi:power-socket-us
                show_state: true
                tap_action:
                  action: toggle
                styles:
                  card:
                    - border-radius: 18px
                    - min-height: 88px
                    - padding: 14px

              - type: custom:button-card
                entity: switch.bedroom_plug
                name: Bedroom Plug
                icon: mdi:power-socket-us
                show_state: true
                tap_action:
                  action: toggle
                styles:
                  card:
                    - border-radius: 18px
                    - min-height: 88px
                    - padding: 14px

      ############################################################
      # MIDDLE COLUMN
      ############################################################

      - type: grid
        cards:

          - type: heading
            heading: Climate
            heading_style: title
            icon: mdi:thermostat

          - type: clock
            title: memento mori
            clock_style: digital
            clock_size: large
            show_seconds: true
            time_zone: America/Chicago
            no_background: false
            card_mod:
              style: |
                ha-card {
                  border-radius: 18px !important;
                  background: rgba(24,26,31,0.91);
                  border: 1px solid rgba(255,255,255,0.06);
                  box-shadow: none;
                }

          - type: custom:mushroom-climate-card
            entity: climate.home_thermostat
            name: Thermostat
            show_temperature_control: true
            collapsible_controls: false
            hvac_modes:
              - heat
              - cool
              - "off"

          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-template-card
                entity: sensor.indoor_temperature
                primary: Inside
                secondary: "{{ states('sensor.indoor_temperature') }} °F"
                icon: mdi:home-thermometer
                icon_color: orange

              - type: custom:mushroom-template-card
                primary: Outside
                secondary: "{{ state_attr('weather.home', 'temperature') }} °F"
                icon: mdi:thermometer
                icon_color: red

              - type: custom:mushroom-template-card
                entity: sensor.indoor_humidity
                primary: Inside Humidity
                secondary: "{{ states('sensor.indoor_humidity') }} %"
                icon: mdi:water-percent
                icon_color: blue

              - type: custom:mushroom-template-card
                primary: Outside Humidity
                secondary: "{{ state_attr('weather.home', 'humidity') }} %"
                icon: mdi:water-outline
                icon_color: cyan

              - type: custom:mushroom-template-card
                primary: Dew Point
                secondary: "{{ state_attr('weather.home', 'dew_point') }} °F"
                icon: mdi:weather-fog
                icon_color: cyan

              - type: custom:mushroom-template-card
                primary: UV Index
                secondary: "{{ state_attr('weather.home', 'uv_index') }}"
                icon: mdi:weather-sunny-alert
                icon_color: amber

          - type: heading
            heading: Weather
            heading_style: subtitle
            icon: mdi:weather-partly-cloudy

          - type: weather-forecast
            entity: weather.home
            show_current: true
            show_forecast: true
            forecast_type: daily

          - type: heading
            heading: Climate Trend
            heading_style: subtitle
            icon: mdi:chart-line

          - type: custom:apexcharts-card
            graph_span: 12h
            header:
              show: true
              title: Indoor Environment
              show_states: true
              colorize_states: true
            series:
              - entity: sensor.indoor_temperature
                name: Temperature
                type: area
                stroke_width: 2
                opacity: 0.15
                color: "#FF9E64"
              - entity: sensor.indoor_humidity
                name: Humidity
                type: line
                stroke_width: 2
                color: "#7AA2F7"
            apex_config:
              chart:
                height: 225px
                toolbar:
                  show: false
              grid:
                borderColor: rgba(255,255,255,0.06)
              legend:
                show: false

          - type: heading
            heading: HVAC Schedule
            heading_style: subtitle
            icon: mdi:calendar-clock

          - type: custom:scheduler-card
            include:
              - climate.home_thermostat
            sort_by:
              - state
              - relative-time
            show_toggle_switches: false
            discover_existing: true
            show_header_toggle: false

      ############################################################
      # RIGHT COLUMN
      ############################################################

      - type: grid
        cards:

          - type: heading
            heading: Energy
            heading_style: title
            icon: mdi:lightning-bolt

          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-template-card
                entity: sensor.solar_power
                primary: Solar
                secondary: "{{ states('sensor.solar_power') }} kW"
                icon: mdi:solar-power
                icon_color: lime

              - type: custom:mushroom-template-card
                entity: sensor.home_load
                primary: Home Load
                secondary: "{{ states('sensor.home_load') }} kW"
                icon: mdi:home-lightning-bolt
                icon_color: blue

              - type: custom:mushroom-template-card
                entity: sensor.grid_power
                primary: Grid
                secondary: "{{ states('sensor.grid_power') }} kW"
                icon: mdi:transmission-tower
                icon_color: red

              - type: custom:mushroom-template-card
                entity: sensor.battery_power
                primary: Battery Use
                secondary: "{{ states('sensor.battery_power') }} kW"
                icon: mdi:battery-charging
                icon_color: amber

          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:button-card
                entity: sensor.battery_state_of_charge
                name: Battery
                label: State of Charge
                icon: mdi:home-battery
                show_state: true
                show_label: true
                styles:
                  card:
                    - border-radius: 18px
                    - padding: 18px
                    - min-height: 112px
                  grid:
                    - grid-template-areas: '"i n" "i s" "i l"'
                    - grid-template-columns: 56px 1fr
                  state:
                    - font-size: 24px
                    - font-weight: 700

              - type: custom:button-card
                entity: sensor.home_energy_daily
                name: Home Use
                label: Today
                icon: mdi:home-lightning-bolt
                show_state: true
                show_label: true
                styles:
                  card:
                    - border-radius: 18px
                    - padding: 18px
                    - min-height: 112px
                  grid:
                    - grid-template-areas: '"i n" "i s" "i l"'
                    - grid-template-columns: 56px 1fr
                  state:
                    - font-size: 24px
                    - font-weight: 700

          - type: heading
            heading: Today
            heading_style: subtitle
            icon: mdi:calendar-today

          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-template-card
                entity: sensor.solar_energy_daily
                primary: Solar Generated
                secondary: "{{ states('sensor.solar_energy_daily') }} kWh"
                icon: mdi:white-balance-sunny
                icon_color: lime

              - type: custom:mushroom-template-card
                entity: sensor.home_energy_daily
                primary: Home Consumption
                secondary: "{{ states('sensor.home_energy_daily') }} kWh"
                icon: mdi:home-lightning-bolt
                icon_color: blue

              - type: custom:mushroom-template-card
                entity: sensor.grid_import_daily
                primary: Grid Import
                secondary: "{{ states('sensor.grid_import_daily') }} kWh"
                icon: mdi:transmission-tower-import
                icon_color: red

              - type: custom:mushroom-template-card
                entity: sensor.grid_export_daily
                primary: Grid Export
                secondary: "{{ states('sensor.grid_export_daily') }} kWh"
                icon: mdi:transmission-tower-export
                icon_color: green

              - type: custom:mushroom-template-card
                entity: sensor.battery_charge_daily
                primary: Battery Charged
                secondary: "{{ states('sensor.battery_charge_daily') }} kWh"
                icon: mdi:battery-plus
                icon_color: amber

              - type: custom:mushroom-template-card
                entity: sensor.battery_discharge_daily
                primary: Battery Discharged
                secondary: "{{ states('sensor.battery_discharge_daily') }} kWh"
                icon: mdi:battery-minus
                icon_color: purple

          - type: heading
            heading: Power Trend
            heading_style: subtitle
            icon: mdi:chart-areaspline

          - type: custom:apexcharts-card
            graph_span: 12h
            header:
              show: true
              title: Power Flow
              show_states: true
              colorize_states: true
            series:
              - entity: sensor.home_load
                name: Home
                type: area
                stroke_width: 2
                opacity: 0.16
                color: "#7AA2F7"
              - entity: sensor.solar_power
                name: Solar
                type: area
                stroke_width: 2
                opacity: 0.12
                color: "#9ECE6A"
              - entity: sensor.grid_power
                name: Grid
                type: line
                stroke_width: 2
                color: "#F7768E"
            apex_config:
              chart:
                height: 250px
                toolbar:
                  show: false
              stroke:
                curve: smooth
              grid:
                borderColor: rgba(255,255,255,0.06)
              legend:
                show: false
              dataLabels:
                enabled: false
              tooltip:
                theme: dark
